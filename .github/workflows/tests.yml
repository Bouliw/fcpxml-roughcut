# Runs the tests on every push and pull request: time maths, FCPXML, subtitles, transcript,
# ffprobe on generated files, and the DTD check (xmllint). No footage and no Whisper model needed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Pinned: Python 3.9 (macOS's own python3) is not available for newer Ubuntu runner images.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libxml2-utils && pip install numpy anthropic "pillow==12.3.0; python_version >= '3.10'" "pillow==11.3.0; python_version < '3.10'"
      - name: Shell scripts parse
        run: for f in scripts/*.sh examples/*.sh modules/*/*.sh modules/*/scripts/*.sh modules/*/scripts/run; do bash -n "$f"; done
      - name: Tests
        run: python -m unittest discover -s tests -v

  app:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Roughcut builds
        run: swift build -c release --package-path app
      - name: Build scripts parse
        run: for f in app/build_app.sh app/runtime/*.sh; do bash -n "$f"; done

  secrets:
    # Scans the whole git history for secrets, so pushes made without the local pre-push hook are covered too
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
